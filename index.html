<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Козацька Рада — Голосування</title>

<style>

/* =========================
   БАЗА
========================= */

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

/* =========================
   СІТКА
========================= */

.voting-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:24px;
    max-width:1200px;
    margin:auto;
}

/* =========================
   КАРТКА
========================= */

.vote-item{

    width:100%;
    max-width:550px;

    padding:12px;

    border-radius:14px;
    background:#fff;

    box-sizing:border-box;

    min-height:420px;

    border:1px solid #ddd;

    /* hover animation */
    transition:
        transform .2s ease,
        box-shadow .2s ease;

    box-shadow:
        0 4px 12px rgba(0,0,0,.06);

    /* skeleton loader */
    background-image:linear-gradient(
        90deg,
        #f0f0f0 25%,
        #e3e3e3 50%,
        #f0f0f0 75%
    );

    background-size:200% 100%;

    animation:loading 1.3s linear infinite;
}

/* hover */
.vote-item:hover{
    transform:translateY(-4px);

    box-shadow:
        0 8px 20px rgba(0,0,0,.12);
}

/* коли FB завантажився */
.vote-item.loaded{

    animation:none;

    background-image:none;

    background-color:#fff;
}

/* skeleton animation */
@keyframes loading{

    0%{
        background-position:200% 0;
    }

    100%{
        background-position:-200% 0;
    }
}

</style>
</head>

<body>

<h1>⚔️ Обери свого Козака</h1>

<div class="voting-container">

    <!-- КАРТКА 1 -->
    <div class="vote-item">

        <div
            class="fb-post"

            data-href="https://www.facebook.com/permalink.php?story_fbid=pfbid0dYLUenoVmDqyMbWenj3mSHiokYjdL6QbqGH2sYwZ2fuVkja2Wfhpu5L4doPVk7jCl&id=61589720438503"

            data-show-text="true">

        </div>

    </div>

    <!-- КАРТКА 2 -->
    <div class="vote-item">

        <div
            class="fb-post"

            data-href="https://www.facebook.com/permalink.php?story_fbid=PASTE_REAL_POST_ID&id=61589720438503"

            data-show-text="true">

        </div>

    </div>

</div>

<!-- Facebook root -->
<div id="fb-root"></div>

<script>

/* =========================
   FACEBOOK INIT
========================= */

window.fbAsyncInit = function(){

    FB.init({

        xfbml:true,

        version:'v23.0'
    });

    /*
      коли FB embed-и відрендерились:
      - прибираємо skeleton loader
      - додаємо клас loaded
    */

    FB.Event.subscribe('xfbml.render', function(){

        document
            .querySelectorAll('.vote-item')
            .forEach(function(item){

                item.classList.add('loaded');

            });

    });

};

</script>

<!-- Facebook SDK -->
<script
    async
    defer
    crossorigin="anonymous"
    src="https://connect.facebook.net/uk_UA/sdk.js">
</script>

</body>
</html>
