<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>«Козацькі Сміхолики» — Веселі козацькі меми та анімаційний серіал</title>
  <meta name="description" content="Дивіться кумедні пригоди, жарти та короткі ролики про козаків у сучасному форматі. «Козацькі Сміхолики» — український гумор, народна мудрість та справжній козацький вайб!">
  <meta name="keywords" content="козацькі сміхолики, козацькі меми, український гумор, козаки анімація, веселі козаки, короткі ролики, український серіал, козацькі пригоди, смішне відео">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="«Козацькі Сміхолики» — Веселі козацькі меми та анімаційний серіал">
  <meta property="og:description" content="Козаки знову оживають у веселих коротких історіях, пригодах та сучасних мемах. Заходьте та підніміть свій дух 🇺🇦">
  <meta property="og:url" content="https://detectfraud.github.io/cossack-rada"> 
  <meta property="og:image" content="https://raw.githubusercontent.com/detectfraud/cossack-test/main/Kozaki.png"> 
  <meta property="og:site_name" content="Козацькі Сміхолики">

  <link rel="canonical" href="https://detectfraud.github.io/cossack-rada">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Лічильник адміна (показується тільки при iamtheboss) -->
<div id="my-stats-counter"></div>

<div class="lang-switcher">
  <button class="lang-btn active" id="btn-uk">UA</button>
  <button class="lang-btn"        id="btn-en">EN</button>
</div>

<div class="wrapper">

  <div class="sidebar">
    <div class="sidebar-sticky">
      <div class="ad" id="ad-left">
        <!-- Adsterra банер 160×600 (лівий) -->
      </div>
    </div>
  </div>

  <div class="content">

    <h1 id="js-hero"></h1>

    <div class="card">
      <p id="js-sub"></p>
    </div>

    <div class="card">
      <p id="js-before-video" style="margin:0 0 10px;color:#bbb;font-size:14px;"></p>

      <div class="fb-post-mock">
        <div class="fb-post-header">
          <div class="fb-author-info">
            <a class="fb-author-name" id="js-author-name" href="#" target="_blank"></a>
            <span class="fb-post-date" id="js-post-date"></span>
          </div>
        </div>
        <p class="fb-post-text" id="js-post-text"></p>
        
        <div class="video-container" style="position: relative;">
          <iframe
            id="js-youtube-player"
            src="https://www.youtube.com/embed/iIcqtIL6XqU?rel=0&modestbranding=1&showinfo=0&enablejsapi=1"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

        <div class="fb-stats">
          <span class="fb-stat">
            <img src="hand.png" width="16" height="16" alt="Лайки">
            <span id="js-likes"></span>
          </span>
          <span class="fb-stat">
            <img src="spread.png" width="16" height="16" alt="Коментарі">
            <span id="js-comments"></span>
          </span>
          <span class="fb-stat">
            <img src="comment.png" width="16" height="16" alt="Поширення">
            <span id="js-shares"></span>
          </span>
        </div>
      </div>
    </div>

    <div class="land-description-section">
      <h2 id="js-land-title"></h2>
      <p id="js-land-p1"></p>
      <p id="js-land-p2"></p>
      
      <div id="js-more-content" class="more-content">
        <p id="js-land-p3"></p>
        
        <p id="js-land-cta1" class="cta-lead"></p>
        <ul class="land-list">
          <li></li>
          <li></li>
          <li></li>
          <li></li>
        </ul>
        
        <p id="js-land-cta2" class="cta-lead"></p>
        <ul class="land-list">
          <li></li>
          <li></li>
          <li></li>
        </ul>
        
        <p id="js-land-footer" class="land-footer-text"></p>
      </div>

      <button id="js-read-more-btn" class="read-more-link"></button>
    </div>

    <div class="card">
      <h3 id="js-donate-heading"></h3>
      <p id="js-donate-text" style="white-space:pre-line;font-size:14px;line-height:1.7;margin-bottom:20px;"></p>
      
      <div class="instruction-block" style="background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:15px; margin-bottom:20px; text-align:left;">
        <h4 id="js-inst-title" style="color:gold; margin:0 0 10px 0; font-size:16px;"></h4>
        
        <div id="js-inst-more-content" class="more-content">
          <p id="js-inst-intro" style="font-size:13px; color:#ccc; line-height:1.5; margin:0 0 10px 0;"></p>
          <p id="js-inst-adblock-warn" style="font-size:13px; color:#ff4d4d; font-weight:bold; margin:0 0 15px 0;"></p>
          
          <div class="inst-steps-gallery" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:10px;">
            <div class="zoom-img-box" style="position:relative; width:100px; height:100px; border:1px solid #444; border-radius:4px; overflow:visible; cursor:pointer;">
              <img src="step1.png" alt="Крок 1" class="gallery-thumb" style="width:100%; height:100%; object-fit:cover; transition: transform 0.3s ease;">
            </div>
            <div class="zoom-img-box" style="position:relative; width:100px; height:100px; border:1px solid #444; border-radius:4px; overflow:visible; cursor:pointer;">
              <img src="step2.png" alt="Крок 2" class="gallery-thumb" style="width:100%; height:100%; object-fit:cover; transition: transform 0.3s ease;">
            </div>
          </div>
        </div>
        
        <button id="js-inst-more-btn" class="read-more-link" style="margin-top:5px; font-size:12px; color:gold; background:none; border:none; cursor:pointer; padding:0;"></button>
      </div>

      <div id="js-offer-modal" style="display: none; background:#222; border:2px solid gold; border-radius:8px; padding:15px; margin-bottom:20px; text-align:center;">
        <p id="js-offer-text" style="color:#fff; font-size:14px; margin:0 0 15px 0; line-height:1.4;"></p>
        <div style="margin-bottom:15px;">
          <label style="color:#bbb; font-size:12px; cursor:pointer;">
            <input type="checkbox" id="js-never-show-cb" style="margin-right:5px; vertical-align:middle;">
            <span id="js-cb-label"></span>
          </label>
        </div>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button id="js-offer-yes" style="background:gold; color:#000; border:none; padding:6px 16px; font-weight:bold; border-radius:4px; cursor:pointer;">ТАК</button>
          <button id="js-offer-no" style="background:#444; color:#fff; border:none; padding:6px 16px; border-radius:4px; cursor:pointer;">НІ</button>
        </div>
      </div>

      <div class="donate-wrapper">
        <button id="js-smart-btn" class="donate-smart-btn"></button>
        <a class="btn-donatello" id="js-donate-btn" href="https://donatello.to/cossack-rada" target="_blank"></a>
      </div>
    </div>

    <p class="next-cta" id="js-next"></p>

  </div>

  <div class="sidebar">
    <div class="sidebar-sticky">
      <div class="ad" id="ad-right">
        <!-- Adsterra банер 160×600 (правий) -->
      </div>
    </div>
  </div>

</div>

<div class="sticky" id="js-sticky"></div>

<!-- Адмін-кнопка скидання паузи -->
<button id="js-admin-clear-btn" style="position:fixed; bottom:15px; right:15px; z-index:9999; background:rgba(255,0,0,0.4); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:4px; padding:5px 8px; font-size:11px; cursor:pointer; font-family:monospace; transition:background 0.2s;" onmouseover="this.style.background='rgba(255,0,0,0.9)'" onmouseout="this.style.background='rgba(255,0,0,0.4)'">
  🛠️ Reset 24h
</button>

<script src="main.js"></script>

</body>
</html>
