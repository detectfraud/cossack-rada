<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Козацький серіал</title>
  <link rel="stylesheet" href="style.css">
  <meta name="monetag" content="576250b2e4efbf523b07b865bbe248b0">
</head>
<body>

<div class="lang-switcher">
  <button class="lang-btn active" id="btn-uk">UA</button>
  <button class="lang-btn"        id="btn-en">EN</button>
</div>

<div class="wrapper">

  <div class="sidebar">
    <div class="sidebar-sticky">
      <div class="ad" id="ad-left"></div>
    </div>
  </div>

  <div class="content">

    <h1 id="js-hero"></h1>

    <div class="card">
      <p id="js-sub"></p>
    </div>

    <div class="card">
      <p id="js-before-video" style="margin:0 0 10px;color:#bbb;font-size:14px;"></p>

      <div class="fb-post-mock">
        <div class="fb-post-header">
          <div class="fb-author-info">
            <a class="fb-author-name" id="js-author-name" href="#" target="_blank"></a>
            <span class="fb-post-date" id="js-post-date"></span>
          </div>
        </div>
        <p class="fb-post-text" id="js-post-text"></p>
        
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/iIcqtIL6XqU?rel=0&modestbranding=1&showinfo=0"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>

        <div class="fb-stats">
          <span class="fb-stat">
            <img src="hand.png" width="16" height="16" alt="Лайки">
            <span id="js-likes"></span>
          </span>
          <span class="fb-stat">
            <img src="spread.png" width="16" height="16" alt="Коментарі">
            <span id="js-comments"></span>
          </span>
          <span class="fb-stat">
            <img src="comment.png" width="16" height="16" alt="Поширення">
            <span id="js-shares"></span>
          </span>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 id="js-donate-heading"></h3>
      <p id="js-donate-text" style="white-space:pre-line;font-size:14px;line-height:1.7;"></p>
      <a class="btn" id="js-donate-btn" href="https://donatello.to/cossack-rada" target="_blank">💰 </a>
    </div>

    <div class="card">
      <h3 id="js-ads-heading"></h3>
      <p id="js-ads-text" style="white-space:pre-line;font-size:14px;line-height:1.7;"></p>
    </div>

    <p class="next-cta" id="js-next"></p>

  </div>

  <div class="sidebar">
    <div class="sidebar-sticky">
      <div class="ad" id="ad-right"></div>
    </div>
  </div>

</div>

<div class="sticky" id="js-sticky"></div>

<script>(function(s){s.dataset.zone='11040513',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>   

<script src="main.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('https://detectfraud.github.io/sw.js', { scope: '/cossack-rada/' })
        .then(function(reg) {
          console.log('SW успішно зареєстрований для Monetag. Сфера дії:', reg.scope);
        })
        .catch(function(err) {
          console.error('Помилка регистрації SW:', err);
        });
    });
  }
</script>

</body>
</html>
