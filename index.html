<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Козацький серіал</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #fff;
}

/* ===== LANG SWITCHER ===== */
.lang-switcher {
  position: fixed;
  top: 12px;
  right: 16px;
  z-index: 1000;
  display: flex;
  gap: 6px;
}

.lang-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: 20px;
  border: 1px solid #444;
  background: #1a1a1a;
  color: #aaa;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  text-decoration: none;
}

.lang-btn:hover {
  border-color: gold;
  color: gold;
}

.lang-btn.active {
  background: gold;
  color: #000;
  border-color: gold;
}

/* ===== LAYOUT ===== */
.wrapper {
  display: flex;
  justify-content: center;
  max-width: 1200px;
  margin: auto;
}

.sidebar {
  width: 160px;
  padding: 10px;
}

.ad {
  background: #1e1e1e;
  height: 600px;
  border-radius: 10px;
  margin: 10px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  font-size: 12px;
}

/* ADBLOCK MESSAGE */
.adblock-msg {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px;
  text-align: center;
}

.adblock-msg .adblock-icon {
  font-size: 28px;
  margin-bottom: 4px;
}

.adblock-msg p {
  margin: 0;
  font-size: 12px;
  line-height: 1.5;
  color: #aaa;
}

.adblock-msg strong { color: gold; }

.adblock-msg--sticky {
  font-size: 13px;
  color: #ccc;
  padding: 6px;
}

.content {
  flex: 1;
  max-width: 700px;
  padding: 20px;
  padding-top: 50px;
}

h1 {
  text-align: center;
  color: gold;
}

.card {
  background: #1b1b1b;
  padding: 15px;
  margin: 15px 0;
  border-radius: 12px;
}

/* FB POST MOCK */
.fb-post-mock {
  padding: 0;
  overflow: hidden;
  background: #242526;
  border-radius: 12px;
}

.fb-post-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 8px;
}

.fb-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}

.fb-author-info {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.fb-author-name {
  font-size: 14px;
  font-weight: 600;
  color: #e4e6eb;
  text-decoration: none;
}

.fb-author-name:hover { text-decoration: underline; }

.fb-post-date {
  font-size: 12px;
  color: #8a8d91;
  margin-top: 1px;
}

.fb-logo {
  width: 20px;
  height: 20px;
  object-fit: contain;
  opacity: .7;
}

.fb-post-text {
  font-size: 14px;
  line-height: 1.6;
  color: #e4e6eb;
  padding: 0 16px 12px;
  margin: 0;
  white-space: pre-line;
}

.fb-stats {
  display: flex;
  gap: 20px;
  padding: 10px 16px;
  border-top: 1px solid #3a3b3c;
  background: #1c1e21;
}

.fb-stat {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: #8a8d91;
}

/* FB VIDEO RESPONSIVE */
.fb-video {
  width: 100%;
  overflow: hidden;
}

/* BUTTON */
.btn {
  display: block;
  text-align: center;
  padding: 14px;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 10px;
  text-decoration: none;
}

/* NEXT CTA */
.next-cta {
  text-align: center;
  font-size: 15px;
  color: #aaa;
  padding: 10px 0 4px;
}

/* STICKY */
.sticky {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111;
  padding: 8px;
  text-align: center;
  border-top: 1px solid #333;
  z-index: 999;
}

/* MOBILE */
@media (max-width: 900px) {
  .wrapper { flex-direction: column; }
  .sidebar { display: none; }
  .sticky  { display: block; }
}
</style>
</head>

<body>

<!-- LANG SWITCHER -->
<div class="lang-switcher">
  <button class="lang-btn active" id="btn-uk" onclick="setLang('uk')">🇺🇦 UA</button>
  <button class="lang-btn"        id="btn-en" onclick="setLang('en')">🇺🇸 EN</button>
</div>

<div class="wrapper">

  <!-- LEFT ADS -->
  <div class="sidebar">
    <div class="ad" id="ad-left"><!-- MONETAG SLOT --></div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <h1 id="js-hero"></h1>

    <div class="card">
      <p id="js-sub"></p>
    </div>

    <div class="card">
      <p id="js-before-video" style="margin:0 0 10px;color:#bbb;font-size:14px;"></p>

      <!-- FACEBOOK POST MOCK -->
      <div class="fb-post-mock">
        <div class="fb-post-header">
          <img class="fb-avatar" src="https://graph.facebook.com/61589720438503/picture?type=normal" alt="avatar" onerror="this.src='https://i.pravatar.cc/40'">
          <div class="fb-author-info">
            <a class="fb-author-name" id="js-author-name" href="#" target="_blank"></a>
            <span class="fb-post-date" id="js-post-date"></span>
          </div>
          <img class="fb-logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/600px-Facebook_Logo_%282019%29.png" alt="Facebook">
        </div>

        <p class="fb-post-text" id="js-post-text"></p>

        <div class="fb-video">
          <iframe
            src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Fwatch%2F%3Fv%3D1254517756765246&show_text=0&width=700&appId=1315606777335941"
            width="100%"
            height="400"
            style="border:none;overflow:hidden;display:block;"
            scrolling="no"
            frameborder="0"
            allowfullscreen="true"
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
          </iframe>
        </div>

<div class="fb-stats">
  <span class="fb-stat">
    <img src="hand.png" width="16" height="16" alt="Лайки">
    <span id="js-likes"></span>
  </span>
  <span class="fb-stat">
    <img src="comment.png" width="16" height="16" alt="Коментарі">
    <span id="js-comments"></span>
  </span>
  <span class="fb-stat">
    <img src="spread.png" width="16" height="16" alt="Поширення">
    <span id="js-shares"></span>
  </span>
</div>
      </div>
    </div>

    <!-- DONATE -->
    <div class="card">
      <h3 id="js-donate-heading"></h3>
      <p id="js-donate-text" style="white-space:pre-line;font-size:14px;line-height:1.7;"></p>
      <a class="btn" id="js-donate-btn" href="https://donatello.to/yourpage" target="_blank">💰 </a>
    </div>

    <!-- MONETIZATION -->
    <div class="card">
      <h3 id="js-ads-heading"></h3>
      <p id="js-ads-text" style="white-space:pre-line;font-size:14px;line-height:1.7;"></p>
    </div>

    <!-- NEXT CTA -->
    <p class="next-cta" id="js-next"></p>

  </div>

  <!-- RIGHT ADS -->
  <div class="sidebar">
    <div class="ad" id="ad-right"><!-- MONETAG SLOT --></div>
  </div>

</div>

<!-- MOBILE STICKY -->
<div class="sticky" id="js-sticky"><!-- MONETAG SLOT --></div>

<script src="config.js"></script>
<script src="security.js"></script>
<script>
// =============================================
// i18n РЕНДЕР
// =============================================
function setLang(lang) {
  const t = I18N[lang];
  if (!t) return;

  // Зберігаємо вибір
  localStorage.setItem('lang', lang);

  // HTML lang
  document.documentElement.lang = t.html_lang;
  document.title = t.title;

  // Контент
  document.getElementById('js-hero').textContent         = t.hero;
  document.getElementById('js-sub').textContent          = t.sub;
  document.getElementById('js-before-video').textContent = t.before_video;
  document.getElementById('js-post-text').textContent    = t.post_text;
  document.getElementById('js-donate-heading').textContent = t.donate_heading;
  document.getElementById('js-donate-text').textContent  = t.donate_text;
  document.getElementById('js-donate-btn').textContent   = '💰 ' + t.donate_btn;
  document.getElementById('js-ads-heading').textContent  = t.ads_heading;
  document.getElementById('js-ads-text').textContent     = t.ads_text;
  document.getElementById('js-next').textContent         = t.next;

  // Кнопки перемикача
  document.getElementById('btn-uk').classList.toggle('active', lang === 'uk');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  // Зберігаємо поточну мову для security.js (adblock msg)
  window._currentLang = lang;
}

// POST_CONFIG (незмінні дані)
//document.getElementById('js-author-name').textContent = POST_CONFIG.author_name;
//document.getElementById('js-author-name').href        = POST_CONFIG.author_url;
//document.getElementById('js-post-date').textContent   = POST_CONFIG.post_date;
document.getElementById('js-likes').textContent       = POST_CONFIG.likes;
document.getElementById('js-comments').textContent    = POST_CONFIG.comments;
document.getElementById('js-shares').textContent      = POST_CONFIG.shares;

// Визначаємо стартову мову: збережена → параметр URL → uk
(function() {
  const saved    = localStorage.getItem('lang');
  const urlLang  = new URLSearchParams(window.location.search).get('lng');
  const detected = saved || urlLang || 'uk';
  setLang(I18N[detected] ? detected : 'uk');
})();
</script>

</body>
</html>
